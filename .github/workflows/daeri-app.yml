name: 대리내비 APK 빌드

on:
  push:
    paths:
      - "daeri-app/**"
      - ".github/workflows/daeri-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daeri-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # 화면 검사 도구(Robolectric)가 처음에 안드로이드 파일을 인터넷에서 받는데, 가끔 받다가 끊겨서
      # 검사가 전부 실패로 나온다 → 3번까지 다시 시도 (진짜 검사 실패면 3번 다 실패해서 그대로 실패로 남음)
      - name: 테스트 + APK 빌드
        run: |
          for i in 1 2 3; do
            gradle --no-daemon testDebugUnitTest assembleRelease && exit 0
            echo "실패 → 30초 뒤 다시 ($i/3)"; sleep 30
          done
          exit 1
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk daeri-navi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daeri-navi-apk
          path: daeri-app/daeri-navi.apk
