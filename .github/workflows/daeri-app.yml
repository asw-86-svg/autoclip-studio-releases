name: 대리내비 APK 빌드

on:
  push:
    paths:
      - "daeri-app/**"
      - ".github/workflows/daeri-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daeri-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 테스트 + APK 빌드
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk daeri-navi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daeri-navi-apk
          path: daeri-app/daeri-navi.apk
      - name: 다운로드 페이지(Release)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete daeri-navi-latest -y --cleanup-tag || true
          gh release create daeri-navi-latest daeri-navi.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "대리내비 최신 버전 (빌드 ${{ github.run_number }})" \
            --notes "휴대폰에서 아래 daeri-navi.apk 를 눌러 내려받아 설치하세요."
