name: 대리내비 APK 빌드

on:
  push:
    paths:
      - "daeri-app/**"
      - ".github/workflows/daeri-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daeri-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: 테스트 + APK 빌드
        run: gradle --no-daemon testDebugUnitTest assembleRelease
      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk daeri-navi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: daeri-navi-apk
          path: daeri-app/daeri-navi.apk
