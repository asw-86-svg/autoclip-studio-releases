<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html,body,#map{margin:0;height:100%;background:#1E1E21}
  .pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .tag{background:#111;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:13px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .tag:before{display:none}
  .msg{position:absolute;left:0;right:0;top:40%;text-align:center;color:#9A9AA0;font:14px sans-serif;z-index:999}
  /* 운전 중에도 누르기 쉬운 큰 확대/축소 버튼 */
  .leaflet-touch .leaflet-bar a{width:48px;height:48px;line-height:46px;font-size:28px;background:#2A2A2E;color:#fff;border-bottom-color:#444}
  .leaflet-touch .leaflet-bar{border:1px solid #555;border-radius:10px;overflow:hidden}
  .leaflet-control-zoom{margin-right:10px!important;margin-top:10px!important}
  .fit{position:absolute;right:10px;bottom:28px;z-index:1000;width:48px;height:48px;border-radius:10px;border:1px solid #555;
       background:#2A2A2E;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center}
  .leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.4)!important;color:#aaa}
  .leaflet-control-attribution a{color:#ccc}
  /* 카카오 지도용 확대/축소 (Leaflet 버튼과 같은 모양) */
  .zoom{position:absolute;right:10px;top:10px;z-index:1000;display:none;flex-direction:column;border:1px solid #555;border-radius:10px;overflow:hidden}
  .zoom a{width:48px;height:48px;line-height:46px;text-align:center;font-size:28px;background:#2A2A2E;color:#fff;border-bottom:1px solid #444;user-select:none}
  /* 어두운 지도: 지도 그림만 반전 (핀·말풍선은 그대로) */
  .dark #map img, .dark .leaflet-tile{filter:invert(.92) hue-rotate(180deg) saturate(.55) brightness(.92) contrast(.95)}
  /* 물방울 핀 + 주소 말풍선 */
  .drop{position:relative;width:40px;height:50px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .drop span{position:absolute;left:0;right:0;top:9px;text-align:center;color:#fff;font:700 12px sans-serif}
  .pwrap{display:flex;flex-direction:column;align-items:center}
  /* 주소가 길면 두 줄로 (확대 버튼에 가리지 않게 폭 제한) */
  .callout{background:#fff;color:#222;font:700 14px/1.3 sans-serif;padding:8px 12px;border-radius:12px;margin-bottom:8px;
           box-shadow:0 2px 8px rgba(0,0,0,.4);position:relative;width:max-content;max-width:min(170px, 50vw);word-break:keep-all;white-space:normal;text-align:center}
  .callout:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
</style>
<script src="leaflet/leaflet.js"></script>
</head><body>
<div id="map"></div>
<div class="msg" id="msg">위치 찾는 중…</div>
<div class="zoom" id="zoom"><a id="zin">+</a><a id="zout">−</a></div>
<div class="fit" id="fit" title="출발·도착 한눈에">⤢</div>
<script>
  // 주소에 ?kakao=자바스크립트키 가 있으면 카카오 지도, 없거나 실패하면 OpenStreetMap
  // 물방울 핀 (색, 글자) + 보이면 주소 말풍선
  function pinHtml(p, showCallout) {
    var svg = '<svg width="40" height="50" viewBox="0 0 40 50"><path d="M20 49C20 49 3 30 3 18a17 17 0 0 1 34 0c0 12-17 31-17 31z" fill="' + p[2] + '" stroke="#fff" stroke-width="2.5"/></svg>';
    return '<div class="pwrap">' + (showCallout && p[4] ? '<div class="callout">' + p[4].replace(/</g, '&lt;') + '</div>' : '') +
           '<div class="drop">' + svg + '<span>' + p[3] + '</span></div></div>';
  }
  var focusIdx = -1;   // 확대해서 보고 있는 핀 (말풍선 표시)
  // ?dark=1 이면 어두운 지도 (휴대폰 다크 모드를 따라감)
  if (/[?&]dark=1/.test(location.search)) document.documentElement.className = 'dark';
  var KEY = (location.search.match(/[?&]kakao=([^&]+)/) || [])[1] || '';
  var impl = null;      // {set(pts), fit()}
  var queued = null;    // 지도가 준비되기 전에 들어온 setPoints
  var lastPts = [];
  var msg = document.getElementById('msg');
  document.getElementById('fit').onclick = function () { focusIdx = -1; if (impl) { impl.set(lastPts); impl.fit(); } };

  function useLeaflet(note) {
    if (impl) return;
    var map = L.map('map', {zoomControl: false, attributionControl: true, touchZoom: true, doubleClickZoom: true,
                            scrollWheelZoom: true, tap: true}).setView([36.5, 127.8], 7);
    L.control.zoom({position: 'topright', zoomInTitle: '확대', zoomOutTitle: '축소'}).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' + (note ? ' · ' + note : '')
    }).addTo(map);
    var layer = L.layerGroup().addTo(map);
    impl = {
      set: function (pts) {
        layer.clearLayers();
        pts.forEach(function (p, i) {
          var icon = L.divIcon({className: '', html: '<div style="transform:translate(-50%,-100%);position:absolute">' + pinHtml(p, i == focusIdx) + '</div>', iconSize: [0, 0]});
          L.marker([p[0], p[1]], {icon: icon, zIndexOffset: i == focusIdx ? 1000 : 0}).addTo(layer);
        });
      },
      focus: function (p) { map.setView([p[0], p[1]], 17); },
      fit: function () {
        if (lastPts.length == 1) map.setView([lastPts[0][0], lastPts[0][1]], 15);
        else if (lastPts.length == 2) map.fitBounds([[lastPts[0][0], lastPts[0][1]], [lastPts[1][0], lastPts[1][1]]], {padding: [50, 50]});
      }
    };
    if (queued) { var q = queued; queued = null; setPoints.apply(null, q); }
  }

  function useKakao() {
    var done = false;
    // 6초 안에 카카오 지도가 안 뜨면 (키·도메인 등록 문제, 인터넷) 기본 지도로
    var timer = setTimeout(function () { if (!done) { done = true; useLeaflet('카카오 지도 실패(키·도메인 확인)'); } }, 6000);
    var sc = document.createElement('script');
    sc.src = 'https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=' + encodeURIComponent(KEY);
    sc.onerror = function () { if (!done) { done = true; clearTimeout(timer); useLeaflet('카카오 지도 실패(인터넷·키 확인)'); } };
    sc.onload = function () {
      if (!window.kakao || !kakao.maps) { sc.onerror(); return; }
      kakao.maps.load(function () {
        if (done) return;
        done = true; clearTimeout(timer);
        var km = kakao.maps;
        var map = new km.Map(document.getElementById('map'), {center: new km.LatLng(36.5, 127.8), level: 13});
        var z = document.getElementById('zoom');
        z.style.display = 'flex';
        document.getElementById('zin').onclick = function () { map.setLevel(map.getLevel() - 1, {animate: true}); };
        document.getElementById('zout').onclick = function () { map.setLevel(map.getLevel() + 1, {animate: true}); };
        var objs = [];
        impl = {
          set: function (pts) {
            objs.forEach(function (o) { o.setMap(null); }); objs = [];
            pts.forEach(function (p, i) {
              var ov = new km.CustomOverlay({position: new km.LatLng(p[0], p[1]), content: pinHtml(p, i == focusIdx), yAnchor: 1, zIndex: i == focusIdx ? 10 : 1});
              ov.setMap(map); objs.push(ov);
            });
          },
          focus: function (p) { map.setLevel(4); map.setCenter(new km.LatLng(p[0], p[1])); },
          fit: function () {
            if (lastPts.length == 1) { map.setLevel(4); map.setCenter(new km.LatLng(lastPts[0][0], lastPts[0][1])); }
            else if (lastPts.length == 2) {
              var b = new km.LatLngBounds();
              lastPts.forEach(function (p) { b.extend(new km.LatLng(p[0], p[1])); });
              map.setBounds(b, 60, 60, 60, 60);
            }
          }
        };
        if (queued) { var q = queued; queued = null; setPoints.apply(null, q); }
      });
    };
    document.head.appendChild(sc);
  }

  // 안드로이드에서 호출: setPoints(출발위도, 출발경도, 도착위도, 도착경도, 못찾은이유) — 못 찾은 쪽은 null
  function setPoints(olat, olng, dlat, dlng, why, oname, dname) {
    if (!impl) { queued = [olat, olng, dlat, dlng, why, oname, dname]; return; }
    var pts = [];
    if (olat != null) pts.push([olat, olng, '#3D85F0', '출발', oname || '', 'o']);
    if (dlat != null) pts.push([dlat, dlng, '#E5484D', '도착', dname || '', 'd']);
    focusIdx = -1;
    impl.set(pts);
    if (pts.length == 0) { msg.textContent = '출발지·도착지 위치를 못 찾았어요' + (why ? '\n' + why : ''); msg.style.whiteSpace = 'pre-line'; return; }
    if (why) { msg.textContent = (olat == null ? '출발지' : '도착지') + ' 위치를 못 찾았어요\n' + why; msg.style.whiteSpace = 'pre-line'; msg.style.top = 'auto'; msg.style.bottom = '8px'; msg.style.background = 'rgba(0,0,0,.6)'; msg.style.padding = '6px'; }
    else msg.style.display = 'none';
    lastPts = pts;
    impl.fit();
  }

  // 안드로이드 ⊙ 버튼: focusPoint('o') 출발 / focusPoint('d') 도착 — 그 위치로 크게 확대하고 주소 말풍선
  function focusPoint(which) {
    if (!impl) return;
    var i = lastPts.findIndex(function (p) { return p[5] == which; });
    if (i < 0) return;
    focusIdx = i; impl.set(lastPts); impl.focus(lastPts[i]);
  }

  if (KEY) useKakao(); else useLeaflet();
</script>
</body></html>
