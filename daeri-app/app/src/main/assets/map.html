<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html,body,#map{margin:0;height:100%;background:#1E1E21}
  .pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
  .tag{background:#111;color:#fff;border:0;border-radius:8px;font-weight:700;font-size:13px;padding:3px 8px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .tag:before{display:none}
  .msg{position:absolute;left:0;right:0;top:40%;text-align:center;color:#9A9AA0;font:14px sans-serif;z-index:999}
  .leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.4)!important;color:#aaa}
  .leaflet-control-attribution a{color:#ccc}
</style>
<script src="leaflet/leaflet.js"></script>
</head><body>
<div id="map"></div>
<div class="msg" id="msg">위치 찾는 중…</div>
<script>
  // 기본: 대한민국 가운데
  var map = L.map('map', {zoomControl: true, attributionControl: true}).setView([36.5, 127.8], 7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19,
    attribution: '&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
  var layer = L.layerGroup().addTo(map);

  function pin(lat, lng, color, label) {
    var icon = L.divIcon({className: '', html: '<div class="pin" style="background:' + color + '"></div>', iconSize: [24, 24], iconAnchor: [12, 12]});
    return L.marker([lat, lng], {icon: icon}).bindTooltip(label, {permanent: true, direction: 'top', offset: [0, -12], className: 'tag'});
  }

  // 안드로이드에서 호출: setPoints(출발위도, 출발경도, 도착위도, 도착경도) — 못 찾은 쪽은 null
  function setPoints(olat, olng, dlat, dlng) {
    layer.clearLayers();
    var pts = [];
    if (olat != null) { pin(olat, olng, '#3D85F0', '출발').addTo(layer); pts.push([olat, olng]); }
    if (dlat != null) { pin(dlat, dlng, '#E5484D', '도착').addTo(layer); pts.push([dlat, dlng]); }
    if (pts.length == 2) L.polyline(pts, {color: '#3D85F0', weight: 3, opacity: .8, dashArray: '6 8'}).addTo(layer);
    var msg = document.getElementById('msg');
    if (pts.length == 0) { msg.textContent = '출발지·도착지 위치를 못 찾았어요'; return; }
    msg.style.display = 'none';
    if (pts.length == 1) map.setView(pts[0], 15);
    else map.fitBounds(pts, {padding: [40, 40]});
  }
</script>
</body></html>
